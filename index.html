<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#391519] flex flex-col justify-center items-center min-h-screen font-sans">

  <main class="bg-[#722F37] rounded-2xl shadow-2xl p-8 w-[600px] flex flex-col items-center">
    
    <!-- Judul -->
    <header class="mb-6">
      <h1 class="text-3xl font-extrabold text-[#EFDFBB]">To Do List</h1>
    </header>

    <!-- Input Bar -->
    <section class="w-full flex flex-col items-center space-y-4">
      <!-- Input + Date + Add button sejajar -->
      <div class="flex w-full justify-between space-x-3">
        <input 
          type="text" 
          id="task-input" 
          placeholder="Enter your task here..." 
          class="flex-1 bg-transparent border border-[#EFDFBB]/40 caret-[#EFDFBB] text-[#EFDFBB] px-3 py-2 rounded-md focus:outline-none placeholder-[#EFDFBB]/50"
        >
        <input 
          type="date" 
          id="date-input" 
          class="bg-transparent border border-[#EFDFBB]/40 text-[#EFDFBB] px-3 py-2 rounded-md focus:outline-none"
        >
        <button 
          id="add-task-button" 
          class="bg-[#EFDFBB] text-[#722F37] font-semibold px-4 py-2 rounded-md hover:scale-105 transition">
          Add
        </button>
      </div>

      <!-- Filter & Delete All sejajar -->
      <div class="flex w-full justify-between mt-3">
        <button 
          id="filter-task" 
          class="bg-[#391519] text-[#EFDFBB] px-5 py-2 font-semibold rounded-md hover:scale-105 transition">
          Filter
        </button>
        <button 
          id="delete-all" 
          class="bg-[#EFDFBB] text-[#722F37] px-5 py-2 font-semibold rounded-md hover:scale-105 transition">
          Delete All
        </button>
      </div>
    </section>

     <!-- Task Table -->
    <section class="tasks-section bg-[#391519] w-full mt-6 rounded-md p-4 text-center">
      <table class="w-full border-collapse">
        <thead>
          <tr class="text-[#EFDFBB] text-sm border-b border-[#EFDFBB]/20">
            <th class="py-2 text-left pl-3">TASK</th>
            <th class="py-2">DUE DATE</th>
            <th class="py-2">STATUS</th>
            <th class="py-2 pr-3 text-right">ACTIONS</th>
          </tr>
        </thead>
        <tbody id="tasks-list">
          <tr>
            <td colspan="4" class="py-6 text-[#EFDFBB]/60 text-sm text-center">No task found</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer class="mt-6 text-[#EFDFBB] text-sm">
    &copy; ardi 2025
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
